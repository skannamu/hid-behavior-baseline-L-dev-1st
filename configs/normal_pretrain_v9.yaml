stage:
  name: "normal_pretraining"
  version: "9.0.0-schema-v2-stable"
  feature_schema_version: "2.0.0"
  schema_hash: "665802343c1e4fc4b7e94974a36879483fe98733c66ea82afd13f132817cd0f2"

data:
  minimum_independent_groups: 3
  split_group_mode: "participant"
  random_window_split: false
  train_ratio: 0.70
  calibration_ratio: 0.15
  test_ratio: 0.15
  seed: 20260804
  manifest_required_for_final_run: true

training_sampling:
  enabled: true
  balance_by: ["participant_id", "scenario"]
  balance_mode: "equal"
  window_subsample_stride: 5
  target_windows_per_group: null
  max_windows_per_group: 3000
  calibration_and_test_use_full_windows: true

normalization:
  type: "median_iqr"
  fit_on: "balanced_train_only"

training:
  epochs: 50
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 8
  min_delta: 0.00001
  gradient_clip_norm: 5.0
  classifier_weight: 0.0

prototype:
  source: "balanced_train_only"

calibration:
  source: "calibration_only"
  target_fpr: 0.01
  detection_rule: "score > threshold"
  quantile_method: "higher"

test:
  source: "untouched_test"
  allowed_metrics:
    - reconstruction_fpr
    - prototype_fpr
  forbidden_metrics_without_attacks:
    - attack_detection_rate
    - classifier_accuracy
